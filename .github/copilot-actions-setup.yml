name: Copilot Actions Setup

# This workflow runs before the firewall is enabled in Copilot coding agent sessions.
# It's used to install dependencies that require access to external package repositories
# that would otherwise be blocked by firewall rules.

on:
  workflow_dispatch:

env:
  # Additional domains allowed through the Copilot firewall
  # Required for Composer to download PHP packages from GitHub
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: api.github.com,codeload.github.com,github.com

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Configure Composer GitHub token
        run: |
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          fi

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
