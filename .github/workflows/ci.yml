name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Validate PHP syntax
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 -P4 php -l

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Verify composer files
        run: |
          echo "Checking for composer.json..."
          if [ ! -f composer.json ]; then
            echo "ERROR: composer.json file not found!"
            exit 1
          fi
          echo "composer.json found"
          
          echo "Checking for composer.lock..."
          if [ ! -f composer.lock ]; then
            echo "WARNING: composer.lock file not found! Creating from composer.json..."
            composer update --no-interaction --prefer-dist --no-progress
          else
            echo "composer.lock found"
          fi
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
      - name: Verify vendor directory and PHPUnit installation
        run: |
          echo "Checking vendor directory..."
          ls -la vendor/ || echo "vendor directory does not exist"
          echo "Checking vendor/bin directory..."
          ls -la vendor/bin/ || echo "vendor/bin directory does not exist"
          echo "Checking PHPUnit binary..."
          if [ -f vendor/bin/phpunit ]; then
            echo "PHPUnit binary found"
            vendor/bin/phpunit --version
          else
            echo "ERROR: PHPUnit binary not found at vendor/bin/phpunit"
            exit 1
          fi
      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --testdox
